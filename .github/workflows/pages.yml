name: Build portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: "portfolio-build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Synchronize all public WordPress articles
        # The page also loads articles live from WordPress, so a temporary API outage should not block a deploy.
        continue-on-error: true
        run: python scripts/sync_wordpress_posts.py
      - name: Install dependencies
        run: npm ci
      - name: Build static site for Cloudflare Pages
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Confirm the Pages output exists
        run: test -f out/index.html && test -d out/_next
